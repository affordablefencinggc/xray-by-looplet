name: CI & Distribution Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-engine-audit:
    name: Web Studio & Vector Engine Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-web-release
          path: .vercel/output/
          if-no-files-found: error

      - name: Validate Sidecar Packager
        run: npm run build:sidecar:dry

  tauri-desktop-matrix:
    name: Tauri Desktop Build (${{ matrix.platform }})
    needs: web-and-engine-audit
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Desktop Application
        run: npm run tauri:build

      - name: Upload Desktop Artifacts (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: xray-desktop-linux
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

      - name: Upload Desktop Artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: xray-desktop-windows
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

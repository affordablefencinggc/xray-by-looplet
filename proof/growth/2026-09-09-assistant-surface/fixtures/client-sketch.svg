<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="'Segoe Print','Comic Sans MS',cursive">
  <rect width="1400" height="1000" fill="#f7f3e8"/>
  <g stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- rough outer plan 36 x 18 m -->
    <path d="M 220 300 L 1180 296 L 1184 780 L 224 786 Z" stroke-width="5"/>
    <!-- west stair core 3 x 6 -->
    <path d="M 224 300 L 304 302 L 306 462 L 226 464 Z"/>
    <path d="M 232 320 L 298 322 M 232 340 L 298 342 M 232 360 L 298 362 M 232 380 L 298 382 M 232 400 L 298 402 M 232 420 L 298 422 M 232 440 L 298 442"/>
    <!-- east stair core 3 x 6 + lift 2.5 x 2.5 -->
    <path d="M 1100 298 L 1182 296 L 1184 460 L 1102 462 Z"/>
    <path d="M 1108 318 L 1176 316 M 1108 338 L 1176 336 M 1108 358 L 1176 356 M 1108 378 L 1176 376 M 1108 398 L 1176 396 M 1108 418 L 1176 416 M 1108 438 L 1176 436"/>
    <path d="M 1102 470 L 1184 468 L 1186 536 L 1104 538 Z"/>
    <path d="M 1104 470 L 1186 536 M 1184 468 L 1102 538"/>
    <!-- corridor 2.4 m wide along the middle -->
    <path d="M 306 510 L 1102 506" stroke-dasharray="14 10"/>
    <path d="M 306 574 L 1102 570" stroke-dasharray="14 10"/>
    <!-- lab partitions north side (4 labs) -->
    <path d="M 505 302 L 507 510 M 705 301 L 707 508 M 905 300 L 907 507"/>
    <!-- south side: office, workshop, plant -->
    <path d="M 555 574 L 557 784 M 905 572 L 907 782"/>
    <!-- doors from corridor into labs (double doors) -->
    <path d="M 390 510 q 24 -40 48 0 M 590 509 q 24 -40 48 0 M 790 508 q 24 -40 48 0 M 990 507 q 24 -40 48 0"/>
    <!-- roller door west end -->
    <path d="M 226 640 L 226 740" stroke-width="9"/>
    <!-- windows ticks along the north wall every 3 m -->
    <path d="M 340 296 l 30 0 M 420 296 l 30 0 M 500 296 l 30 0 M 580 296 l 30 0 M 660 296 l 30 0 M 740 296 l 30 0 M 820 296 l 30 0 M 900 296 l 30 0 M 980 296 l 30 0 M 1060 296 l 30 0" stroke="#1a5fb4" stroke-width="7"/>
    <!-- dimension lines -->
    <path d="M 220 250 L 1180 246 M 220 240 L 220 260 M 1180 236 L 1180 256"/>
    <path d="M 1240 296 L 1244 780 M 1230 296 L 1250 296 M 1234 780 L 1254 780"/>
    <!-- north arrow -->
    <path d="M 120 140 L 120 60 M 120 60 L 105 85 M 120 60 L 135 85"/>
  </g>
  <g fill="#2b2b2b" font-size="30">
    <text x="640" y="236">36.0 m</text>
    <text x="1262" y="548">18.0 m</text>
    <text x="100" y="175" font-size="26">N</text>
    <text x="230" y="290" font-size="24">STAIR 3x6</text>
    <text x="1104" y="290" font-size="24">STAIR 3x6</text>
    <text x="1108" y="560" font-size="22">LIFT 2.5x2.5</text>
    <text x="360" y="420">LAB 1</text>
    <text x="560" y="420">LAB 2</text>
    <text x="760" y="420">LAB 3</text>
    <text x="960" y="420">LAB 4</text>
    <text x="620" y="552" font-size="24">CORRIDOR 2.4 m</text>
    <text x="330" y="700">WORKSHOP</text>
    <text x="640" y="700">OFFICE</text>
    <text x="960" y="700">PLANT</text>
    <text x="236" y="770" font-size="22">roller door 4 m</text>
    <text x="330" y="330" font-size="20" fill="#1a5fb4">windows 1.8 m wide every 3 m (north + south)</text>
  </g>
  <g fill="#8a1c1c" font-size="28">
    <text x="60" y="880">CLIENT NOTES — "Riverside Lab &amp; Workshop"</text>
    <text x="60" y="920" font-size="24">• 3 storeys + a smaller PLANT level on top (plant level = east half only)   • storey height 3.6 m, slabs 200 mm</text>
    <text x="60" y="955" font-size="24">• same layout every storey (labs north, workshop/office/plant south)   • double doors 1.8 m from corridor into each lab, 0.9 m doors elsewhere</text>
    <text x="60" y="990" font-size="24">• skillion roof over the whole footprint falling to the south at 5°, 600 mm eaves   • name it "Riverside Lab &amp; Workshop"</text>
  </g>
  <text x="1050" y="120" font-size="26" fill="#2b2b2b" transform="rotate(-6 1050 120)">rough sketch — not to scale!</text>
</svg>

[package]
name = "xray-by-looplet"
version = "0.1.0"
description = "X-Ray by Looplet — Tauri desktop shell (CAD studio + takeoff engine)"
authors = ["Looplet"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "xray_by_looplet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
xray-engine-host = { path = "../engine/host" }
